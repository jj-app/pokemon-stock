<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-200 min-h-screen p-4 pb-12 font-sans">

    <div class="max-w-md mx-auto pt-2 pb-5 text-center">
        <h1 class="text-2xl font-black text-zinc-800 tracking-tight">Pokemon Stock</h1>
    </div>

    <div class="max-w-md mx-auto w-full space-y-3.5" id="inventory-list">
        </div>

    <script>
        const inventoryContainer = document.getElementById('inventory-list');

        // ⚙️ THE ENGINE
        async function loadInventory() {
            try {
                // THE CACHE BUSTER
                const cacheBuster = new Date().getTime();
                const response = await fetch(`inventory.json?v=${cacheBuster}`);
                const items = await response.json();

                // Split the items into our 3 Tiers
                const comingSoon = items.filter(item => item.isComingSoon);
                const inStock = items.filter(item => !item.isComingSoon && item.stock > 0);
                const outOfStock = items.filter(item => !item.isComingSoon && item.stock === 0);

                // Clear the container before loading
                inventoryContainer.innerHTML = '';

                // A reusable blueprint for drawing the cards
                function createCardHTML(item, status) {
                    const isOutOfStock = status === 'out-of-stock';
                    const isComingSoon = status === 'coming-soon';

                    const cardClass = isOutOfStock
                        ? "bg-white rounded-xl shadow-md border border-zinc-100 p-2.5 opacity-50 grayscale transition-all w-full"
                        : "bg-white rounded-xl shadow-md border border-zinc-100 p-2.5 transition-all w-full";

                    // The Image Cache Buster Fix applied here!
                    const imageSrc = `${item.image}?v=${cacheBuster}`;

                    // Build the Right-Side (Stock vs Release Date)
                    let rightSideHTML = '';
                    if (isComingSoon) {
                        rightSideHTML = `
                            <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Release</span>
                            <span class="text-sm font-black text-blue-600 leading-tight mt-1 text-center">${item.releaseDate || 'TBA'}</span>
                        `;
                    } else {
                        const stockDisplay = isOutOfStock
                            ? `<span class="text-red-600 font-black text-xl line-through decoration-2 mt-0.5">0</span>`
                            : `<span class="text-2xl font-black text-zinc-900 leading-none mt-0.5">${item.stock}</span>`;
                        rightSideHTML = `
                            <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Stock</span>
                            ${stockDisplay}
                        `;
                    }

                    // --- TAGS LOGIC ---
                    let tagsHTML = '';
                    
                    if (isComingSoon) {
                        tagsHTML += `<span class="bg-blue-100 text-blue-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">⏳ Coming Soon</span>`;
                    }

                    if (!isComingSoon && !isOutOfStock && (item.stock === 1 || item.stock === 2)) {
                        tagsHTML += `<span class="bg-red-100 text-red-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">🚨 Almost Gone</span>`;
                    }
                    
                    if (item.isNew && !isOutOfStock) {
                        tagsHTML += `<span class="bg-amber-100 text-amber-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">✨ New</span>`;
                    }

                    if (item.isPopular && !isOutOfStock) {
                        tagsHTML += `<span class="bg-violet-100 text-violet-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">🔥 Popular</span>`;
                    }

                    const tagsContainer = tagsHTML 
                        ? `<div class="flex justify-center space-x-1.5 mb-2">${tagsHTML}</div>` 
                        : '';

                    return `
                        <div class="${cardClass}">
                            ${tagsContainer}

                            <h2 class="text-base font-bold text-center text-zinc-800 mb-1.5 leading-tight">${item.name}</h2>
                            
                            <div class="flex bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 items-center">
                                
                                <div class="w-1/3 flex-shrink-0 p-0.5">
                                    <img src="${imageSrc}" alt="${item.name}" class="w-full h-auto aspect-square object-cover rounded shadow-sm bg-zinc-200">
                                </div>
                                
                                <div class="w-1/3 flex flex-col items-center justify-center border-r border-zinc-200 px-1 py-1">
                                    <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Cost</span>
                                    <span class="text-2xl font-black text-emerald-600 leading-none mt-0.5">$${item.cost}</span>
                                </div>
                                
                                <div class="w-1/3 flex flex-col items-center justify-center px-1 py-1">
                                    ${rightSideHTML}
                                </div>
                                
                            </div>
                        </div>
                    `;
                }

                // 1. Draw COMING SOON items (At the very top)
                if (comingSoon.length > 0) {
                    inventoryContainer.innerHTML += `
                        <div class="pt-2 pb-1 flex items-center justify-center w-full opacity-80">
                            <div class="flex-1 h-px bg-blue-300"></div>
                            <span class="mx-4 text-[10px] font-black text-blue-600 uppercase tracking-[0.2em]">Coming Soon</span>
                            <div class="flex-1 h-px bg-blue-300"></div>
                        </div>
                    `;
                    comingSoon.forEach(item => {
                        inventoryContainer.innerHTML += createCardHTML(item, 'coming-soon');
                    });
                }

                // 2. Draw IN STOCK items
                if (inStock.length > 0 && comingSoon.length > 0) {
                    // Only show this divider if there are coming soon items above it
                    inventoryContainer.innerHTML += `
                        <div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60">
                            <div class="flex-1 h-px bg-zinc-400"></div>
                            <span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Available Now</span>
                            <div class="flex-1 h-px bg-zinc-400"></div>
                        </div>
                    `;
                }
                inStock.forEach(item => {
                    inventoryContainer.innerHTML += createCardHTML(item, 'in-stock');
                });

                // 3. Draw OUT OF STOCK items
                if (outOfStock.length > 0) {
                    inventoryContainer.innerHTML += `
                        <div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60">
                            <div class="flex-1 h-px bg-zinc-400"></div>
                            <span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Out of Stock</span>
                            <div class="flex-1 h-px bg-zinc-400"></div>
                        </div>
                    `;
                    outOfStock.forEach(item => {
                        inventoryContainer.innerHTML += createCardHTML(item, 'out-of-stock');
                    });
                }

            } catch (error) {
                inventoryContainer.innerHTML = `<p class="text-center text-sm font-bold text-red-500">Could not load inventory.</p>`;
            }
        }

        loadInventory();
    </script>
</body>
</html>
