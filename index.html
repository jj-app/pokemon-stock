<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-200 min-h-screen p-4 pb-12 font-sans">

    <div class="max-w-md mx-auto pt-2 pb-4 text-center">
        <h1 class="text-2xl font-black text-zinc-800 tracking-tight">Pokemon Stock</h1>
    </div>

    <div class="max-w-md mx-auto mb-5 flex justify-center bg-zinc-300 rounded-xl p-1 shadow-inner border border-zinc-300/50">
        <button id="tab-btn-sealed" onclick="switchTab('sealed')" class="flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 bg-white text-zinc-900 shadow-sm pointer-events-none">Pokemon</button>
        <button id="tab-btn-accessories" onclick="switchTab('accessories')" class="flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-700 cursor-pointer">Accessories</button>
    </div>

    <div class="max-w-md mx-auto w-full space-y-3.5" id="bucket-pokemon"></div>
    
    <div class="max-w-md mx-auto w-full space-y-3.5 hidden" id="bucket-accessories"></div>

    <script>
        const bucketPokemon = document.getElementById('bucket-pokemon');
        const bucketAccessories = document.getElementById('bucket-accessories');
        const tabBtnSealed = document.getElementById('tab-btn-sealed');
        const tabBtnAccessories = document.getElementById('tab-btn-accessories');
        let currentTab = 'sealed';

        // ⚡ INSTANT TAB SWITCHER
        function switchTab(tabName) {
            if (currentTab === tabName) return;
            currentTab = tabName;

            if (tabName === 'sealed') {
                tabBtnSealed.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 bg-white text-zinc-900 shadow-sm pointer-events-none";
                tabBtnAccessories.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-700 cursor-pointer";
                bucketPokemon.classList.remove('hidden');
                bucketAccessories.classList.add('hidden');
            } else {
                tabBtnAccessories.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 bg-white text-zinc-900 shadow-sm pointer-events-none";
                tabBtnSealed.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-700 cursor-pointer";
                bucketAccessories.classList.remove('hidden');
                bucketPokemon.classList.add('hidden');
            }
        }

        // ⚙️ ENGINE 1: POKEMON
        async function loadSealedInventory() {
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch(`inventory.json?v=${cacheBuster}`);
                const items = await response.json();

                const comingSoon = items.filter(item => item.isComingSoon);
                const inStock = items.filter(item => !item.isComingSoon && item.stock > 0);
                const outOfStock = items.filter(item => !item.isComingSoon && item.stock === 0);

                let htmlPayload = '';

                function createCardHTML(item, status) {
                    const isOutOfStock = status === 'out-of-stock';
                    const isComingSoon = status === 'coming-soon';
                    const imageSrc = `${item.image}?v=${cacheBuster}`;

                    const preloadImg = new Image();
                    preloadImg.src = imageSrc;

                    const cardClass = isOutOfStock
                        ? "bg-white rounded-xl shadow-md border border-zinc-100 p-2.5 opacity-50 grayscale transition-all w-full animate-fade-in"
                        : "bg-white rounded-xl shadow-md border border-zinc-100 p-2.5 transition-all w-full animate-fade-in";
                    
                    const displayCost = Number.isInteger(item.cost) ? item.cost : item.cost.toFixed(2);

                    let rightSideHTML = '';
                    if (isComingSoon) {
                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Release</span><span class="text-sm font-black text-blue-600 leading-tight mt-1 text-center">${item.releaseDate || 'TBA'}</span>`;
                    } else {
                        const stockDisplay = isOutOfStock ? `<span class="text-red-600 font-black text-xl line-through decoration-2 mt-0.5">0</span>` : `<span class="text-2xl font-black text-zinc-900 leading-none mt-0.5">${item.stock}</span>`;
                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Stock</span>${stockDisplay}`;
                    }

                    return `
                        <div class="${cardClass}">
                            <h2 class="text-base font-bold text-center text-zinc-800 mb-1.5 leading-tight">${item.name}</h2>
                            <div class="flex bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 items-center">
                                <div class="w-1/3 flex-shrink-0 p-0.5">
                                    <img src="${imageSrc}" alt="${item.name}" class="w-full h-auto aspect-square object-cover rounded shadow-sm bg-zinc-200">
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center border-r border-zinc-200 px-1 py-1">
                                    <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Cost</span>
                                    <span class="text-2xl font-black text-emerald-600 leading-none mt-0.5">$${displayCost}</span>
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center px-1 py-1">
                                    ${rightSideHTML}
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (comingSoon.length > 0) {
                    htmlPayload += `<div class="pt-2 pb-1 flex items-center justify-center w-full opacity-80"><div class="flex-1 h-px bg-blue-300"></div><span class="mx-4 text-[10px] font-black text-blue-600 uppercase tracking-[0.2em]">Coming Soon</span><div class="flex-1 h-px bg-blue-300"></div></div>`;
                    comingSoon.forEach(item => htmlPayload += createCardHTML(item, 'coming-soon'));
                }
                if (inStock.length > 0 && comingSoon.length > 0) {
                    htmlPayload += `<div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60"><div class="flex-1 h-px bg-zinc-400"></div><span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Available Now</span><div class="flex-1 h-px bg-zinc-400"></div></div>`;
                }
                inStock.forEach(item => htmlPayload += createCardHTML(item, 'in-stock'));
                if (outOfStock.length > 0) {
                    htmlPayload += `<div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60"><div class="flex-1 h-px bg-zinc-400"></div><span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Out of Stock</span><div class="flex-1 h-px bg-zinc-400"></div></div>`;
                    outOfStock.forEach(item => htmlPayload += createCardHTML(item, 'out-of-stock'));
                }
                
                bucketPokemon.innerHTML = htmlPayload;

            } catch (error) {
                bucketPokemon.innerHTML = `<p class="text-center text-sm font-bold text-red-500 mt-10">Could not load Pokemon inventory.</p>`;
            }
        }

        // ⚙️ ENGINE 2: ACCESSORIES
        async function loadAccessoriesInventory() {
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch(`accessories.json?v=${cacheBuster}`);
                const items = await response.json();

                const limited = items.filter(item => item.isLimited);
                const standard = items.filter(item => !item.isLimited);

                let htmlPayload = '';

                function createAccessoryHTML(item, index) {
                    let imageSrc = `${item.image}?v=${cacheBuster}`;
                    
                    if (item.variants && item.variants.length > 0) {
                        imageSrc = `${item.variants[0].image}?v=${cacheBuster}`;
                        
                        item.variants.forEach(v => {
                            const preloadImg = new Image();
                            preloadImg.src = `${v.image}?v=${cacheBuster}`;
                        });
                    } else {
                        const preloadImg = new Image();
                        preloadImg.src = imageSrc;
                    }
                    
                    const displayCost = Number.isInteger(item.cost) ? item.cost : item.cost.toFixed(2);
                    let rightSideHTML = '';
                    
                    if (item.variants && item.variants.length > 0) {
                        let dotsHTML = item.variants.map((v, vIndex) => {
                            const isActive = vIndex === 0 
                                ? 'ring-2 ring-offset-1 ring-zinc-800 scale-110 opacity-100' 
                                : 'scale-90 opacity-70 border border-zinc-300';
                                
                            return `<button 
                                onclick="selectVariant('${index}', ${vIndex}, '${v.image}?v=${cacheBuster}')" 
                                id="btn-${index}-${vIndex}"
                                class="variant-btn-${index} w-8 h-8 rounded-full shadow-sm transition-all duration-300 focus:outline-none ${isActive}" 
                                style="background-color: ${v.color};" 
                                title="Swap Color"></button>`;
                        }).join('');

                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5 block text-center">Colors</span><div class="flex flex-wrap gap-2 justify-center w-full">${dotsHTML}</div>`;
                    } else {
                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Status</span><span class="text-sm font-black text-emerald-600 leading-tight mt-1 text-center">Available</span>`;
                    }

                    return `
                        <div class="bg-white rounded-xl shadow-md border ${item.isLimited ? 'border-amber-200' : 'border-zinc-100'} p-2.5 transition-all w-full animate-fade-in">
                            <h2 class="text-base font-bold text-center text-zinc-800 mb-1.5 leading-tight">${item.name}</h2>
                            <div class="flex bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 items-center">
                                <div class="w-1/3 flex-shrink-0 p-0.5">
                                    <img id="acc-img-${index}" src="${imageSrc}" alt="${item.name}" class="w-full h-auto aspect-square object-cover rounded shadow-sm bg-zinc-200 transition-all duration-300 ease-in-out">
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center border-r border-zinc-200 px-1 py-1">
                                    <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Cost</span>
                                    <span class="text-2xl font-black text-emerald-600 leading-none mt-0.5">$${displayCost}</span>
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center px-1 py-1">
                                    ${rightSideHTML}
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (limited.length > 0) {
                    htmlPayload += `<div class="pt-2 pb-1 flex items-center justify-center w-full opacity-90"><div class="flex-1 h-px bg-amber-400"></div><span class="mx-4 text-[10px] font-black text-amber-600 uppercase tracking-[0.2em]">Limited Edition</span><div class="flex-1 h-px bg-amber-400"></div></div>`;
                    limited.forEach((item, index) => htmlPayload += createAccessoryHTML(item, 'lim-' + index));
                }

                if (standard.length > 0 && limited.length > 0) {
                    htmlPayload += `<div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60"><div class="flex-1 h-px bg-zinc-400"></div><span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Standard Accessories</span><div class="flex-1 h-px bg-zinc-400"></div></div>`;
                }

                standard.forEach((item, index) => htmlPayload += createAccessoryHTML(item, 'std-' + index));
                
                bucketAccessories.innerHTML = htmlPayload;

            } catch (error) {
                bucketAccessories.innerHTML = `<p class="text-center text-sm font-bold text-red-500 mt-10">Could not load Accessories inventory.</p>`;
            }
        }

        function selectVariant(itemIndex, variantIndex, newImageSrc) {
            document.getElementById(`acc-img-${itemIndex}`).src = newImageSrc;
            
            const buttons = document.querySelectorAll(`.variant-btn-${itemIndex}`);
            buttons.forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-1', 'ring-zinc-800', 'scale-110', 'opacity-100');
                btn.classList.add('scale-90', 'opacity-70', 'border', 'border-zinc-300');
            });
            
            const activeBtn = document.getElementById(`btn-${itemIndex}-${variantIndex}`);
            activeBtn.classList.remove('scale-90', 'opacity-70', 'border', 'border-zinc-300');
            activeBtn.classList.add('ring-2', 'ring-offset-1', 'ring-zinc-800', 'scale-110', 'opacity-100');
        }

        // 🚨 ADVANCED FORENSIC DISCORD ALARM 🚨
        async function fireDiscordAlert() {
            if (sessionStorage.getItem('store_visited')) return;
            sessionStorage.setItem('store_visited', 'true');
            
            const part1 = "https://discord.com/api/webhooks/";
            const part2 = "1531224586975449189/RhAZQ7bAX3F36Va8IcJtkqN7l80T6KvoRCxDNXU9Ut_B0H2vJnHdLA6DdSYSOfN9KnXl"; 
            const webhookUrl = part1 + part2;
            
            let userIP = "Hidden/Unknown";
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                userIP = ipData.ip;
            } catch(e) {}

            const userAgent = navigator.userAgent;
            const language = navigator.language || "Unknown";
            const screen = `${window.screen.width}x${window.screen.height}`;
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";
            
            let osType = "Unknown Device";
            if (userAgent.includes("iPhone")) osType = "iPhone / iOS";
            else if (userAgent.includes("Android")) osType = "Android Device";
            else if (userAgent.includes("Mac OS")) osType = "Mac / Apple PC";
            else if (userAgent.includes("Windows")) osType = "Windows PC";

            const payload = {
                content: "@everyone 🚨 New Store Visitor!",
                embeds: [{
                    title: "👀 Store Opened",
                    color: 3447003,
                    fields: [
                        { name: "📱 Device Type", value: osType, inline: true },
                        { name: "🌐 IP Address", value: userIP, inline: true },
                        { name: "🌍 Location Info", value: `Language: ${language}\nTimezone: ${timeZone}`, inline: false },
                        { name: "🖥️ Screen Size", value: screen, inline: true },
                        { name: "🔬 Raw User Agent", value: `\`\`\`${userAgent}\`\`\``, inline: false }
                    ],
                    footer: { text: "Pokemon Stock Alert System" },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (e) {}
        }

        // Add Simple Animations
        document.head.insertAdjacentHTML("beforeend", `<style>@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }</style>`);

        // 🚀 INITIALIZE ALL ENGINES SIMULTANEOUSLY ON LOAD
        loadSealedInventory();
        loadAccessoriesInventory();
        fireDiscordAlert();
    </script>
</body>
</html>
