<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-200 min-h-screen p-4 pb-12 font-sans">

    <!-- Header -->
    <div class="max-w-md mx-auto pt-2 pb-4 text-center">
        <h1 class="text-2xl font-black text-zinc-800 tracking-tight">Pokemon Stock</h1>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-md mx-auto mb-5 flex justify-center bg-zinc-300 rounded-xl p-1 shadow-inner border border-zinc-300/50">
        <button id="tab-sealed" onclick="switchTab('sealed')" class="flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 bg-white text-zinc-900 shadow-sm pointer-events-none">Pokemon</button>
        <button id="tab-accessories" onclick="switchTab('accessories')" class="flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-700">Accessories</button>
    </div>

    <!-- Inventory Container -->
    <div class="max-w-md mx-auto w-full space-y-3.5" id="inventory-list"></div>

    <script>
        const inventoryContainer = document.getElementById('inventory-list');
        const tabSealed = document.getElementById('tab-sealed');
        const tabAccessories = document.getElementById('tab-accessories');
        let currentTab = 'sealed';

        function switchTab(tabName) {
            if (currentTab === tabName) return;
            currentTab = tabName;

            if (tabName === 'sealed') {
                tabSealed.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 bg-white text-zinc-900 shadow-sm pointer-events-none";
                tabAccessories.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-700 cursor-pointer";
                loadSealedInventory();
            } else {
                tabAccessories.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 bg-white text-zinc-900 shadow-sm pointer-events-none";
                tabSealed.className = "flex-1 py-2.5 text-sm font-black rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-700 cursor-pointer";
                loadAccessoriesInventory();
            }
        }

        // ⚙️ ENGINE 1: POKEMON
        async function loadSealedInventory() {
            try {
                inventoryContainer.innerHTML = '<p class="text-center text-sm font-bold text-zinc-400 animate-pulse mt-10">Loading inventory...</p>';
                const cacheBuster = new Date().getTime();
                const response = await fetch(`inventory.json?v=${cacheBuster}`);
                const items = await response.json();

                const comingSoon = items.filter(item => item.isComingSoon);
                const inStock = items.filter(item => !item.isComingSoon && item.stock > 0);
                const outOfStock = items.filter(item => !item.isComingSoon && item.stock === 0);

                inventoryContainer.innerHTML = '';

                function createCardHTML(item, status) {
                    const isOutOfStock = status === 'out-of-stock';
                    const isComingSoon = status === 'coming-soon';

                    const cardClass = isOutOfStock
                        ? "bg-white rounded-xl shadow-md border border-zinc-100 p-2.5 opacity-50 grayscale transition-all w-full animate-fade-in"
                        : "bg-white rounded-xl shadow-md border border-zinc-100 p-2.5 transition-all w-full animate-fade-in";

                    const imageSrc = `${item.image}?v=${cacheBuster}`;
                    const displayCost = Number.isInteger(item.cost) ? item.cost : item.cost.toFixed(2);

                    let rightSideHTML = '';
                    if (isComingSoon) {
                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Release</span><span class="text-sm font-black text-blue-600 leading-tight mt-1 text-center">${item.releaseDate || 'TBA'}</span>`;
                    } else {
                        const stockDisplay = isOutOfStock ? `<span class="text-red-600 font-black text-xl line-through decoration-2 mt-0.5">0</span>` : `<span class="text-2xl font-black text-zinc-900 leading-none mt-0.5">${item.stock}</span>`;
                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Stock</span>${stockDisplay}`;
                    }

                    let tagsHTML = '';
                    if (isComingSoon) tagsHTML += `<span class="bg-blue-100 text-blue-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">⏳ Coming Soon</span>`;
                    if (!isComingSoon && !isOutOfStock && (item.stock === 1 || item.stock === 2)) tagsHTML += `<span class="bg-red-100 text-red-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">🚨 Almost Gone</span>`;
                    if (item.isNew && !isOutOfStock) tagsHTML += `<span class="bg-amber-100 text-amber-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">✨ New</span>`;
                    if (item.isPopular && !isOutOfStock) tagsHTML += `<span class="bg-violet-100 text-violet-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">🔥 Popular</span>`;

                    const tagsContainer = tagsHTML ? `<div class="flex justify-center space-x-1.5 mb-2">${tagsHTML}</div>` : '';

                    return `
                        <div class="${cardClass}">
                            ${tagsContainer}
                            <h2 class="text-base font-bold text-center text-zinc-800 mb-1.5 leading-tight">${item.name}</h2>
                            <div class="flex bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 items-center">
                                <div class="w-1/3 flex-shrink-0 p-0.5">
                                    <img src="${imageSrc}" alt="${item.name}" class="w-full h-auto aspect-square object-cover rounded shadow-sm bg-zinc-200">
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center border-r border-zinc-200 px-1 py-1">
                                    <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Cost</span>
                                    <span class="text-2xl font-black text-emerald-600 leading-none mt-0.5">$${displayCost}</span>
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center px-1 py-1">
                                    ${rightSideHTML}
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (comingSoon.length > 0) {
                    inventoryContainer.innerHTML += `<div class="pt-2 pb-1 flex items-center justify-center w-full opacity-80"><div class="flex-1 h-px bg-blue-300"></div><span class="mx-4 text-[10px] font-black text-blue-600 uppercase tracking-[0.2em]">Coming Soon</span><div class="flex-1 h-px bg-blue-300"></div></div>`;
                    comingSoon.forEach(item => inventoryContainer.innerHTML += createCardHTML(item, 'coming-soon'));
                }
                if (inStock.length > 0 && comingSoon.length > 0) {
                    inventoryContainer.innerHTML += `<div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60"><div class="flex-1 h-px bg-zinc-400"></div><span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Available Now</span><div class="flex-1 h-px bg-zinc-400"></div></div>`;
                }
                inStock.forEach(item => inventoryContainer.innerHTML += createCardHTML(item, 'in-stock'));
                if (outOfStock.length > 0) {
                    inventoryContainer.innerHTML += `<div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60"><div class="flex-1 h-px bg-zinc-400"></div><span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Out of Stock</span><div class="flex-1 h-px bg-zinc-400"></div></div>`;
                    outOfStock.forEach(item => inventoryContainer.innerHTML += createCardHTML(item, 'out-of-stock'));
                }
            } catch (error) {
                inventoryContainer.innerHTML = `<p class="text-center text-sm font-bold text-red-500 mt-10">Could not load Pokemon inventory.</p>`;
            }
        }

        // ⚙️ ENGINE 2: ACCESSORIES
        async function loadAccessoriesInventory() {
            try {
                inventoryContainer.innerHTML = '<p class="text-center text-sm font-bold text-zinc-400 animate-pulse mt-10">Loading accessories...</p>';
                const cacheBuster = new Date().getTime();
                const response = await fetch(`accessories.json?v=${cacheBuster}`);
                const items = await response.json();

                const limited = items.filter(item => item.isLimited);
                const standard = items.filter(item => !item.isLimited);

                inventoryContainer.innerHTML = '';

                function createAccessoryHTML(item, index) {
                    let imageSrc = `${item.image}?v=${cacheBuster}`;
                    
                    // 🎨 SMART FIX: Auto-default to the first variant image (Black) if it exists
                    if (item.variants && item.variants.length > 0) {
                        imageSrc = `${item.variants[0].image}?v=${cacheBuster}`;
                    }
                    
                    const displayCost = Number.isInteger(item.cost) ? item.cost : item.cost.toFixed(2);
                    let rightSideHTML = '';
                    
                    if (item.variants && item.variants.length > 0) {
                        let dotsHTML = item.variants.map((v, vIndex) => {
                            // First dot is highlighted by default
                            const isActive = vIndex === 0 
                                ? 'ring-2 ring-offset-1 ring-zinc-800 scale-110 opacity-100' 
                                : 'scale-90 opacity-70 border border-zinc-300';
                                
                            return `<button 
                                onclick="selectVariant('${index}', ${vIndex}, '${v.image}?v=${cacheBuster}')" 
                                id="btn-${index}-${vIndex}"
                                class="variant-btn-${index} w-6 h-6 rounded-full shadow-sm transition-all duration-300 focus:outline-none ${isActive}" 
                                style="background-color: ${v.color};" 
                                title="Swap Color"></button>`;
                        }).join('');

                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5 block text-center">Colors</span><div class="flex flex-wrap gap-1.5 justify-center w-full">${dotsHTML}</div>`;
                    } else {
                        rightSideHTML = `<span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Status</span><span class="text-sm font-black text-emerald-600 leading-tight mt-1 text-center">Available</span>`;
                    }

                    let tagHTML = item.isLimited ? `<div class="flex justify-center mb-2"><span class="bg-amber-100 text-amber-600 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">🌟 Limited Edition</span></div>` : '';

                    return `
                        <div class="bg-white rounded-xl shadow-md border ${item.isLimited ? 'border-amber-200' : 'border-zinc-100'} p-2.5 transition-all w-full animate-fade-in">
                            ${tagHTML}
                            <h2 class="text-base font-bold text-center text-zinc-800 mb-1.5 leading-tight">${item.name}</h2>
                            <div class="flex bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 items-center">
                                <div class="w-1/3 flex-shrink-0 p-0.5">
                                    <img id="acc-img-${index}" src="${imageSrc}" alt="${item.name}" class="w-full h-auto aspect-square object-cover rounded shadow-sm bg-zinc-200 transition-all duration-300 ease-in-out">
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center border-r border-zinc-200 px-1 py-1">
                                    <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider">Cost</span>
                                    <span class="text-2xl font-black text-emerald-600 leading-none mt-0.5">$${displayCost}</span>
                                </div>
                                <div class="w-1/3 flex flex-col items-center justify-center px-1 py-1">
                                    ${rightSideHTML}
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (limited.length > 0) {
                    inventoryContainer.innerHTML += `<div class="pt-2 pb-1 flex items-center justify-center w-full opacity-90"><div class="flex-1 h-px bg-amber-400"></div><span class="mx-4 text-[10px] font-black text-amber-600 uppercase tracking-[0.2em]">Premium & Limited</span><div class="flex-1 h-px bg-amber-400"></div></div>`;
                    limited.forEach((item, index) => inventoryContainer.innerHTML += createAccessoryHTML(item, 'lim-' + index));
                }

                if (standard.length > 0 && limited.length > 0) {
                    inventoryContainer.innerHTML += `<div class="pt-6 pb-1 flex items-center justify-center w-full opacity-60"><div class="flex-1 h-px bg-zinc-400"></div><span class="mx-4 text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">Standard Accessories</span><div class="flex-1 h-px bg-zinc-400"></div></div>`;
                }

                standard.forEach((item, index) => inventoryContainer.innerHTML += createAccessoryHTML(item, 'std-' + index));

            } catch (error) {
                inventoryContainer.innerHTML = `<p class="text-center text-sm font-bold text-red-500 mt-10">Could not load Accessories inventory.</p>`;
            }
        }

        // 🎨 UI FUNCTION: HIGHLIGHT ACTIVE COLOR DOT
        function selectVariant(itemIndex, variantIndex, newImageSrc) {
            // Swap the main image
            document.getElementById(`acc-img-${itemIndex}`).src = newImageSrc;
            
            // Reset all dots for this specific item back to small/faded
            const buttons = document.querySelectorAll(`.variant-btn-${itemIndex}`);
            buttons.forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-1', 'ring-zinc-800', 'scale-110', 'opacity-100');
                btn.classList.add('scale-90', 'opacity-70', 'border', 'border-zinc-300');
            });
            
            // Pop out the clicked dot and add a ring
            const activeBtn = document.getElementById(`btn-${itemIndex}-${variantIndex}`);
            activeBtn.classList.remove('scale-90', 'opacity-70', 'border', 'border-zinc-300');
            activeBtn.classList.add('ring-2', 'ring-offset-1', 'ring-zinc-800', 'scale-110', 'opacity-100');
        }

        // 🚨 DISCORD SILENT ALARM 🚨
        async function fireDiscordAlert() {
            if (sessionStorage.getItem('store_visited')) return;
            sessionStorage.setItem('store_visited', 'true');
            
            const webhookUrl = "https://discord.com/api/webhooks/1531189204070039623/96nVgL1eO0UMfyAnkYKKSpjt_5tyhGnRaCVOPwFRKhp0VAH278yxLCLxbmRhQiYwSMqu";
            
            try {
                await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-type": "application/json" },
                    body: JSON.stringify({ content: "👀 **Alert!** Someone just opened your Pokemon Storefront!" })
                });
            } catch (e) {}
        }

        document.head.insertAdjacentHTML("beforeend", `<style>@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }</style>`);

        // Initialize App
        loadSealedInventory();
        fireDiscordAlert();
    </script>
</body>
</html>
