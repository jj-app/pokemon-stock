    <script>
        // 🛑 FIREBASE KEYS 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyAHD0_l3t-aTEdlE_28Bspluk7KpL2GAbw",
            authDomain: "order-tracker-58390.firebaseapp.com",
            projectId: "order-tracker-58390",
            storageBucket: "order-tracker-58390.firebasestorage.app",
            messagingSenderId: "599840735038",
            appId: "1:599840735038:web:ce7938b2666e24d01c766f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let allData = { orders: {}, sealed: {}, japanese: {}, accessories: {} };
        let currentSortedSealed = [];
        let currentSortedJapanese = [];
        let currentSortedAccessories = [];

        // 🎨 PREDEFINED BRAND COLORS
        const PREDEFINED_COLORS = [
            { name: 'Black', hex: '#2d2d2d' }, { name: 'Blue', hex: '#0072bc' },
            { name: 'Green', hex: '#22c55e' }, { name: 'Pink', hex: '#e89fa1' },
            { name: 'Purple', hex: '#6547a0' }, { name: 'Red', hex: '#ed1941' },
            { name: 'Turquoise', hex: '#76e5cf' }, { name: 'Yellow', hex: '#ffde17' }
        ];

        // 🚀 GLOBAL OVERLAY LOADER
        function showLoader(msg = "Processing...") {
            document.getElementById('global-loader-text').innerText = msg;
            document.getElementById('global-loader').classList.remove('hidden');
        }
        function hideLoader() {
            document.getElementById('global-loader').classList.add('hidden');
        }

        // 🚀 ORPHAN FILE CLEANUP
        async function deleteFileFromUrl(url) {
            if (!url || !url.includes('firebasestorage')) return;
            try { await storage.refFromURL(url).delete(); } 
            catch(e) { console.warn("Old image not found or already deleted."); }
        }

        // 🚀 CROPPER ENGINE LOGIC
        let pendingUploads = {}; 
        let cropperInstance = null;
        let currentCropCallback = null;
        let currentCropIsSquare = true;

        function handleImageSelect(event, inputId, previewId, containerId, isSquare = true) {
            const file = event.target.files[0];
            if (!file) return;

            currentCropIsSquare = isSquare;
            document.getElementById('cropper-title').innerText = isSquare ? "Crop Product (Square)" : "Crop Image";

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('cropper-image');
                img.src = e.target.result;
                document.getElementById('modal-cropper').classList.remove('hidden');

                if (cropperInstance) cropperInstance.destroy();
                
                const options = { viewMode: 2, dragMode: 'move', autoCropArea: 1, background: false };
                if (isSquare) options.aspectRatio = 1; 

                cropperInstance = new Cropper(img, options);
            };
            reader.readAsDataURL(file);

            currentCropCallback = (blob, dataUrl) => {
                pendingUploads[inputId] = blob;
                const previewEl = document.getElementById(previewId);
                previewEl.src = dataUrl;
                document.getElementById(containerId).classList.remove('hidden');
                
                const textInputId = inputId.replace('-upload', '');
                const relatedTextInput = document.getElementById(textInputId);
                if(relatedTextInput) relatedTextInput.value = '';
            };
            
            event.target.value = ''; 
        }

        function closeCropper() {
            document.getElementById('modal-cropper').classList.add('hidden');
            if (cropperInstance) cropperInstance.destroy();
            currentCropCallback = null;
        }

        function applyCrop() {
            if (!cropperInstance) return;
            let canvasOptions = { imageSmoothingEnabled: true, imageSmoothingQuality: 'high' };
            if (currentCropIsSquare) { canvasOptions.width = 512; canvasOptions.height = 512; }
            const canvas = cropperInstance.getCroppedCanvas(canvasOptions);
            canvas.toBlob((blob) => {
                const dataUrl = canvas.toDataURL('image/webp', 0.8);
                if (currentCropCallback) currentCropCallback(blob, dataUrl);
                closeCropper();
            }, 'image/webp', 0.8);
        }

        async function uploadBlobToFirebase(blob, folderName) {
            const fileName = `${folderName}/${Date.now()}.webp`;
            const ref = storage.ref().child(fileName);
            await ref.put(blob);
            return await ref.getDownloadURL();
        }

        function clearImage(containerId, previewId, existingId, uploadId) {
            document.getElementById(containerId).classList.add('hidden');
            document.getElementById(previewId).src = '';
            document.getElementById(existingId).value = '';
            if(uploadId) {
                document.getElementById(uploadId).value = '';
                pendingUploads[uploadId] = null;
            }
        }

        function updatePreviewDirect(inputId, previewId, containerId) {
            const val = document.getElementById(inputId).value.trim();
            if(val) {
                document.getElementById(previewId).src = getFullImageUrl(val);
                document.getElementById(containerId).classList.remove('hidden');
            } else {
                document.getElementById(containerId).classList.add('hidden');

        // 🚀 BULLETPROOF SILENT ARROW SORTING
        async function moveItem(collection, currentIndex, direction) {
            let arr = [];
            if(collection === 'inventory_sealed') arr = [...currentSortedSealed];
            else if(collection === 'inventory_japanese') arr = [...currentSortedJapanese];
            else arr = [...currentSortedAccessories];

            let swapIndex = currentIndex + direction;
            if (swapIndex < 0 || swapIndex >= arr.length) return; 

            // Physically swap them locally immediately for visual speed (No Loader)
            let temp = arr[currentIndex];
            arr[currentIndex] = arr[swapIndex];
            arr[swapIndex] = temp;

            try {
                let batch = db.batch();
                arr.forEach((item, index) => {
                    let ref = db.collection(collection).doc(item.id);
                    batch.update(ref, { sortOrder: index });
                });
                await batch.commit();
            } catch (e) { alert("Error moving item: " + e.message); }
        }

        // --- QUICK UPDATES ---
        function addQuickUpdate(docId, msg, statusStr) {
            showCustomConfirm(`Update status to "${statusStr}"?`, async () => {
                const docRef = db.collection('orders_public').doc(docId);
                const updateData = { status: statusStr, updates: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toLocaleDateString(), msg: msg }) };
                if (statusStr === "Delivered") updateData.deliveredDate = new Date().toLocaleDateString();
                await docRef.update(updateData);
            });
        }
        async function undoLastUpdate(docId) {
            showCustomConfirm("Delete the most recent timeline update?", async () => {
                const docRef = db.collection('orders_public').doc(docId);
                const doc = await docRef.get();
                if (!doc.exists) return;
                const data = doc.data();
                if (data.updates && data.updates.length > 1) {
                    data.updates.pop(); 
                    const lastMsg = data.updates[data.updates.length - 1].msg || "";
                    let revertedStatus = "Preparing"; 
                    if (lastMsg.includes("Shipped")) revertedStatus = "Shipped";
                    else if (lastMsg.includes("In transit")) revertedStatus = "In Transit";
                    else if (lastMsg.includes("customs")) revertedStatus = "Customs";
                    else if (lastMsg.includes("AusPost Facility")) revertedStatus = "AusPost Hub";
                    else if (lastMsg.includes("Out for delivery")) revertedStatus = "Out for Delivery";
                    else if (lastMsg.includes("Delivered")) revertedStatus = "Delivered";
                    const updatePayload = { updates: data.updates, status: revertedStatus };
                    if (data.deliveredDate && revertedStatus !== "Delivered") updatePayload.deliveredDate = firebase.firestore.FieldValue.delete();
                    await docRef.update(updatePayload);
                } else alert("Cannot delete the first update.");
            }, "Undo", true);
        }

        async function saveOrder() {
            showLoader("Saving Order...");
            const id = document.getElementById('o-id').value;
            const payload = {
                name: document.getElementById('o-name').value,
                eta: document.getElementById('o-eta').value || "TBA",
                status: document.getElementById('o-status').value,
                products: document.getElementById('o-products').value.split(',').map(p=>p.trim()).filter(p=>p)
            };
            if(!payload.name) {
                hideLoader();
                return alert("Needs a name!");
            }

            try {
                if(id) {
                    const uLines = document.querySelectorAll('.update-line');
                    payload.updates = Array.from(uLines).map(l => ({ date: l.querySelector('.u-date').value, msg: l.querySelector('.u-msg').value })).filter(u => u.date && u.msg);
                    if(payload.status === "Delivered" && payload.updates.length) payload.deliveredDate = payload.updates[payload.updates.length-1].date;
                    await db.collection('orders_public').doc(id).update(payload);
                } else {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    payload.updates = [{ date: new Date().toLocaleDateString(), msg: "Order placed." }];
                    await db.collection('orders_public').add(payload);
                }
                hideLoader();
                closeModal('modal-order');
            } catch (e) {
                hideLoader();
                alert("Error: " + e.message);
            }
        }

        async function saveInventory() {
            showLoader("Saving Item...");
            const id = document.getElementById('inv-id').value;
            const collection = document.getElementById('inv-collection').value;
            let finalImageUrl = document.getElementById('inv-existing-image').value.trim();
            
            try {
                if (pendingUploads['inv-image-upload']) {
                    showLoader("Uploading Photo...");
                    finalImageUrl = await uploadBlobToFirebase(pendingUploads['inv-image-upload'], 'pokemon');
                    pendingUploads['inv-image-upload'] = null;
                }

                if(!document.getElementById('inv-name').value || !finalImageUrl) {
                    hideLoader();
                    return alert("Needs Name and Image!");
                }

                if (id) {
                    const oldDoc = await db.collection(collection).doc(id).get();
                    if (oldDoc.exists && oldDoc.data().image && oldDoc.data().image !== finalImageUrl) {
                        await deleteFileFromUrl(oldDoc.data().image);
                    }
                }

                const payload = {
                    name: document.getElementById('inv-name').value,
                    image: finalImageUrl,
                    cost: Number(document.getElementById('inv-cost').value),
                    stock: Number(document.getElementById('inv-stock').value),
                    isComingSoon: document.getElementById('inv-coming').checked,
                    releaseDate: document.getElementById('inv-release').value
                };

                if(id) {
                    const dataSource = collection === 'inventory_japanese' ? allData.japanese : allData.sealed;
                    payload.sortOrder = dataSource[id].sortOrder || 99;
                    await db.collection(collection).doc(id).set(payload);
                } else {
                    const arr = collection === 'inventory_japanese' ? currentSortedJapanese : currentSortedSealed;
                    payload.sortOrder = arr.length;
                    await db.collection(collection).add(payload);
                }
                hideLoader();
                closeModal('modal-inventory');
            } catch(e) {
                hideLoader();
                alert("Error saving: " + e.message);
            }
        }

                hideLoader();
                closeModal('modal-inventory');
            }, "Delete Item", true);
        }

        // 🚀 ACCESSORIES WITH UPLOADER & SWEEPER
        function toggleVariantsUI() {
            const hasVars = document.getElementById('a-has-variants').checked;
            document.getElementById('a-predefined-variants').classList.toggle('hidden', !hasVars);
            document.getElementById('a-main-img-container').classList.toggle('hidden', hasVars);
        }

        function toggleColorInput(i) {
            const isChecked = document.getElementById(`v-cb-${i}`).checked;
            const uploadZone = document.getElementById(`v-upload-zone-${i}`);
            if(isChecked) { uploadZone.classList.remove('hidden'); } 
            else { 
                uploadZone.classList.add('hidden'); 
                document.getElementById(`v-img-upload-${i}`).value = ''; 
                document.getElementById(`v-existing-img-${i}`).value = '';
                pendingUploads[`v-img-upload-${i}`] = null;
            }
        }

        function openAccessoryModal(id = null) {
            document.getElementById('a-id').value = id || '';
            const data = id ? allData.accessories[id] : { name: '', image: '', cost: '', isLimited: false, variants: [] };
            
            document.getElementById('a-name').value = data.name;
            
            // Main Image Reset
            pendingUploads['a-image-upload'] = null;
            document.getElementById('a-existing-image').value = data.image || '';
            document.getElementById('a-image-upload').value = '';
            const mainContainer = document.getElementById('a-image-preview-container');
            if(data.image) { 
                document.getElementById('a-image-preview').src = getFullImageUrl(data.image); 
                mainContainer.classList.remove('hidden'); 
            } else { mainContainer.classList.add('hidden'); }

            document.getElementById('a-cost').value = data.cost;
            document.getElementById('a-limited').checked = data.isLimited;
            
            // Variant Reset
            PREDEFINED_COLORS.forEach((_, i) => {
                document.getElementById(`v-cb-${i}`).checked = false;
                document.getElementById(`v-existing-img-${i}`).value = '';
                document.getElementById(`v-img-upload-${i}`).value = '';
                document.getElementById(`v-upload-zone-${i}`).classList.add('hidden');
                document.getElementById(`v-img-preview-container-${i}`).classList.add('hidden');
                pendingUploads[`v-img-upload-${i}`] = null;
            });

            const hasVariants = data.variants && data.variants.length > 0;
            document.getElementById('a-has-variants').checked = hasVariants;
            toggleVariantsUI();

            if(hasVariants) {
                data.variants.forEach(v => {
                    const index = PREDEFINED_COLORS.findIndex(c => c.hex.toLowerCase() === v.color.toLowerCase());
                    if(index !== -1) {
                        document.getElementById(`v-cb-${index}`).checked = true;
                        document.getElementById(`v-upload-zone-${index}`).classList.remove('hidden');
                        document.getElementById(`v-existing-img-${index}`).value = v.image;
                        document.getElementById(`v-img-preview-${index}`).src = getFullImageUrl(v.image);
                        document.getElementById(`v-img-preview-container-${index}`).classList.remove('hidden');
                    }
                });
            }
            
            document.getElementById('btn-del-accessory').classList.toggle('hidden', !id);
            document.getElementById('modal-accessory').classList.remove('hidden');
        }

        async function saveAccessory() {
            showLoader("Saving Accessory...");
            const id = document.getElementById('a-id').value;
            const hasVariants = document.getElementById('a-has-variants').checked;

            try {
                const payload = {
                    name: document.getElementById('a-name').value,
                    cost: Number(document.getElementById('a-cost').value),
                    isLimited: document.getElementById('a-limited').checked,
                    variants: []
                };

                if(!payload.name) {
                    hideLoader();
                    return alert("Needs a Name!");
                }

                let newUrls = []; 

                if (hasVariants) {
                    for (let i = 0; i < PREDEFINED_COLORS.length; i++) {
                        if (document.getElementById(`v-cb-${i}`).checked) {
                            let finalVUrl = document.getElementById(`v-existing-img-${i}`).value.trim();
                            if (pendingUploads[`v-img-upload-${i}`]) {
                                showLoader(`Uploading ${PREDEFINED_COLORS[i].name} Photo...`);
                                finalVUrl = await uploadBlobToFirebase(pendingUploads[`v-img-upload-${i}`], 'accessories');
                                pendingUploads[`v-img-upload-${i}`] = null;
                            }
                            if(!finalVUrl) {
                                hideLoader();
                                return alert(`Need an image for ${PREDEFINED_COLORS[i].name}!`);
                            }
                            payload.variants.push({ color: PREDEFINED_COLORS[i].hex, image: finalVUrl });
                            newUrls.push(finalVUrl);
                        }
                    }
                    if(payload.variants.length === 0) {
                        hideLoader();
                        return alert("Please select at least one color variant.");
                    }
                    payload.image = payload.variants[0].image; 
                } else {
                    let finalMainUrl = document.getElementById('a-existing-image').value.trim();
                    if (pendingUploads['a-image-upload']) {
                        showLoader("Uploading Photo...");
                        finalMainUrl = await uploadBlobToFirebase(pendingUploads['a-image-upload'], 'accessories');
                        pendingUploads['a-image-upload'] = null;
                    }
                    if(!finalMainUrl) {
                        hideLoader();
                        return alert("Needs a Main Image!");
                    }
                    payload.image = finalMainUrl;
                    newUrls.push(finalMainUrl);
                }

                if(id) {
                    const oldDoc = await db.collection('inventory_accessories').doc(id).get();
                    if(oldDoc.exists) {
                        let oldUrls = [];
                        if (oldDoc.data().image) oldUrls.push(oldDoc.data().image);
                        if (oldDoc.data().variants) oldDoc.data().variants.forEach(v => { if (v.image) oldUrls.push(v.image) });
                        for (let oldUrl of oldUrls) {
                            if (!newUrls.includes(oldUrl)) await deleteFileFromUrl(oldUrl);
                        }
                    }
                    payload.sortOrder = allData.accessories[id].sortOrder || 99;
                    await db.collection('inventory_accessories').doc(id).set(payload);
                } else {
                    payload.sortOrder = currentSortedAccessories.length;
                    await db.collection('inventory_accessories').add(payload);
                }
                hideLoader();
                closeModal('modal-accessory');
            } catch(e) {
                hideLoader();
                alert("Error saving: " + e.message);
            }
        }
        
        async function deleteAccessory() { 
            showCustomConfirm("Permanently delete this Accessory?", async () => {
                showLoader("Deleting Accessory...");
                const id = document.getElementById('a-id').value;
                const doc = await db.collection('inventory_accessories').doc(id).get();
                if(doc.exists) {
                    const data = doc.data();
                    if(data.image) await deleteFileFromUrl(data.image);
                    if(data.variants) {
                        for(let v of data.variants) if(v.image) await deleteFileFromUrl(v.image);
                    }
                }
                await db.collection('inventory_accessories').doc(id).delete(); 
                hideLoader();
                closeModal('modal-accessory');
            }, "Delete Accessory", true);
        }
    </script>
</body>
