        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.2s ease-out forwards; }

    <script>
        // 🛑 FIREBASE KEYS 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyAHD0_l3t-aTEdlE_28Bspluk7KpL2GAbw",
            authDomain: "order-tracker-58390.firebaseapp.com",
            projectId: "order-tracker-58390",
            storageBucket: "order-tracker-58390.firebasestorage.app",
            messagingSenderId: "599840735038",
            appId: "1:599840735038:web:ce7938b2666e24d01c766f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let allData = { orders: {}, pokemon: {}, accessories: {} };
        let currentSortedPokemon = [];
        let currentSortedAccessories = [];

        // 🎨 PREDEFINED BRAND COLORS
        const PREDEFINED_COLORS = [
            { name: 'Black', hex: '#2d2d2d' },
            { name: 'Blue', hex: '#0072bc' },
            { name: 'Green', hex: '#22c55e' },
            { name: 'Pink', hex: '#e89fa1' },
            { name: 'Purple', hex: '#6547a0' },
            { name: 'Red', hex: '#ed1941' },
            { name: 'Turquoise', hex: '#76e5cf' },
            { name: 'Yellow', hex: '#ffde17' }
        ];

        // 🚀 CROPPER ENGINE LOGIC
        let pendingUploads = {}; // Stores perfectly cropped images waiting to be saved
        let cropperInstance = null;
        let currentCropCallback = null;
        let currentCropIsSquare = true;

        function handleImageSelect(event, inputId, previewId, isSquare = true) {
            const file = event.target.files[0];
            if (!file) return;

            currentCropIsSquare = isSquare;
            document.getElementById('cropper-title').innerText = isSquare ? "Crop Product (Square)" : "Crop Logo";

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('cropper-image');
                img.src = e.target.result;
                document.getElementById('modal-cropper').classList.remove('hidden');

                if (cropperInstance) cropperInstance.destroy();
                
                const options = {
                    viewMode: 2,
                    dragMode: 'move',
                    autoCropArea: 1,
                    background: false
                };
                
                if (isSquare) options.aspectRatio = 1; // Force a perfect square

                cropperInstance = new Cropper(img, options);
            };
            reader.readAsDataURL(file);

            currentCropCallback = (blob, dataUrl) => {
                pendingUploads[inputId] = blob;
                const previewEl = document.getElementById(previewId);
                previewEl.src = dataUrl;
                previewEl.classList.remove('hidden');
            };
            
            // Clear the file input so they can select the exact same file again if they mess up
            event.target.value = '';
        }

        function closeCropper() {
            document.getElementById('modal-cropper').classList.add('hidden');
            if (cropperInstance) cropperInstance.destroy();
            currentCropCallback = null;
        }

        function applyCrop() {
            if (!cropperInstance) return;
            
            let canvasOptions = {
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            };

            // Force exact 512x512 sizing for perfect product squares
            if (currentCropIsSquare) {
                canvasOptions.width = 512;
                canvasOptions.height = 512;
            }

            const canvas = cropperInstance.getCroppedCanvas(canvasOptions);

            // Squeeze it down to a tiny, lightning-fast WebP file
            canvas.toBlob((blob) => {
                const dataUrl = canvas.toDataURL('image/webp', 0.8);
                if (currentCropCallback) currentCropCallback(blob, dataUrl);
                closeCropper();
            }, 'image/webp', 0.8);
        }

        async function uploadBlobToFirebase(blob, folderName) {
            const fileName = `${folderName}/${Date.now()}.webp`;
            const ref = storage.ref().child(fileName);
            await ref.put(blob);
            return await ref.getDownloadURL();
        }

        // 🚀 IMAGE RESOLVER
        function getFullImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            return "../" + path.replace(/^\//, ''); 
        }

        function initColors() {
            const container = document.getElementById('a-predefined-variants');
            let html = '<p class="text-[10px] font-bold text-zinc-400 uppercase mb-2">Tick available colors & Upload</p>';
            PREDEFINED_COLORS.forEach((color, i) => {
                html += `
                <div class="flex items-center gap-3 border-b border-zinc-200/50 pb-2 mb-2 last:border-0">
                    <input type="checkbox" id="v-cb-${i}" class="w-5 h-5 cursor-pointer rounded border-zinc-300" onchange="toggleColorInput(${i})">
                    <div class="w-6 h-6 rounded-full shadow-sm border border-zinc-200 flex-shrink-0" style="background-color: ${color.hex};"></div>
                    <label class="text-sm font-bold text-zinc-700 w-16">${color.name}</label>
                    <div id="v-upload-zone-${i}" class="flex-1 hidden flex flex-col gap-1 items-end">
                        <img id="v-img-preview-${i}" class="h-10 w-10 object-cover rounded shadow-sm border hidden bg-white">
                        <input type="hidden" id="v-existing-img-${i}">
                        <input type="file" id="v-img-upload-${i}" accept="image/*" class="text-[10px] w-full" onchange="handleImageSelect(event, 'v-img-upload-${i}', 'v-img-preview-${i}', true)">
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }
        initColors();

        auth.onAuthStateChanged(user => {
            document.getElementById('loading-section').classList.add('hidden');
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadAllData();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        function login() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message)); }
        function logout() { auth.signOut(); }

        function switchAdminTab(tab) {
            ['orders', 'pokemon', 'accessories', 'settings'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(btn) btn.className = "flex-shrink-0 px-4 py-2.5 text-sm font-black rounded-lg transition-all text-zinc-500 snap-start";
                const view = document.getElementById(`view-${t}`);
                if(view) view.classList.add('hidden');
            });
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            if(activeBtn) activeBtn.className = "flex-shrink-0 px-4 py-2.5 text-sm font-black rounded-lg transition-all bg-white text-zinc-900 shadow-sm snap-start";
            const activeView = document.getElementById(`view-${tab}`);
            if(activeView) activeView.classList.remove('hidden');
        }

        function loadAllData() {
            // Settings Banner
            db.collection('store_settings').doc('banner').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('setting-banner-active').checked = data.isActive || false;
                    document.getElementById('setting-banner-heading').value = data.heading || '';
                    document.getElementById('setting-banner-message').value = data.message || '';
                    
                    document.getElementById('setting-existing-logo').value = data.logoUrl || '';
                    if(data.logoUrl) {
                        document.getElementById('setting-logo-preview').src = data.logoUrl;
                        document.getElementById('setting-logo-preview').classList.remove('hidden');
                        document.getElementById('admin-dynamic-logo').src = data.logoUrl;
                        document.getElementById('admin-header-logo').classList.remove('hidden');
                    } else {
                        document.getElementById('setting-logo-preview').classList.add('hidden');
                        document.getElementById('admin-header-logo').classList.add('hidden');
                    }
                }
            });

            // Orders
            db.collection('orders_public').onSnapshot(snap => {
                allData.orders = {};
                let html = '';
                let arr = [];
                snap.forEach(doc => { arr.push({id: doc.id, ...doc.data()}); allData.orders[doc.id] = doc.data(); });
                arr.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                
                arr.forEach(data => {
                    let statusColor = "bg-blue-100 text-blue-800";
                    if(data.status === "Delivered") statusColor = "bg-emerald-100 text-emerald-800";
                    if(data.status === "Preparing") statusColor = "bg-amber-100 text-amber-800";

                    html += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-zinc-200">
                        <div class="flex justify-between items-start mb-2 border-b border-zinc-100 pb-2">
                            <div>
                                <h3 class="font-black text-lg text-zinc-800">${data.name}</h3>
                                <p class="text-xs font-bold text-zinc-500">ETA: <span class="text-zinc-800">${formatEtaDate(data.eta)}</span></p>
                            </div>
                            <span class="${statusColor} text-[10px] font-black uppercase px-2 py-1 rounded shadow-sm">${data.status || 'Preparing'}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openOrderModal('${data.id}')" class="flex-1 text-xs bg-zinc-800 text-white font-bold py-2 rounded-lg">Full Edit / Timeline</button>
                        </div>
                    </div>`;
                });
                document.getElementById('orders-list').innerHTML = html || '<p class="text-zinc-500 text-center bg-white p-4 rounded-xl">No active orders.</p>';
            });

            // Pokemon
            db.collection('inventory_sealed').onSnapshot(snap => {
                allData.pokemon = {};
                let html = '';
                let arr = [];
                snap.forEach(doc => { arr.push({id: doc.id, ...doc.data()}); allData.pokemon[doc.id] = doc.data(); });
                arr.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
                currentSortedPokemon = arr;

                arr.forEach((data, index) => {
                    const badge = data.isComingSoon ? '🟡 Coming Soon' : (data.stock <= 0 ? '🔴 Out of Stock' : `🟢 ${data.stock} in stock`);
                    html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-zinc-200 flex justify-between items-center">
                        <div class="flex flex-col gap-1 pr-3 border-r border-zinc-100">
                            <button onclick="moveItem('inventory_sealed', ${index}, -1)" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-400 text-xs px-2 py-1 rounded shadow-sm">▲</button>
                            <button onclick="moveItem('inventory_sealed', ${index}, 1)" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-400 text-xs px-2 py-1 rounded shadow-sm">▼</button>
                        </div>
                        <div class="flex gap-3 items-center flex-1 pl-3">
                            <img src="${getFullImageUrl(data.image)}" class="w-10 h-10 object-cover rounded bg-white border">
                            <div>
                                <p class="font-black text-sm text-zinc-800 leading-tight">${data.name}</p>
                                <p class="text-[10px] font-bold text-zinc-500">${badge} | $${data.cost}</p>
                            </div>
                        </div>
                        <button onclick="openPokemonModal('${data.id}')" class="bg-zinc-200 px-3 py-1.5 rounded text-xs font-bold ml-2">Edit</button>
                    </div>`;
                });
                document.getElementById('pokemon-list').innerHTML = html || '<p class="text-zinc-500 text-center bg-white p-4 rounded-xl">No Pokemon added yet.</p>';
            });

            // Accessories
            db.collection('inventory_accessories').onSnapshot(snap => {
                allData.accessories = {};
                let html = '';
                let arr = [];
                snap.forEach(doc => { arr.push({id: doc.id, ...doc.data()}); allData.accessories[doc.id] = doc.data(); });
                arr.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
                currentSortedAccessories = arr;

                arr.forEach((data, index) => {
                    const vars = data.variants ? data.variants.length : 0;
                    const img = vars > 0 ? data.variants[0].image : data.image;
                    html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-zinc-200 flex justify-between items-center">
                        <div class="flex flex-col gap-1 pr-3 border-r border-zinc-100">
                            <button onclick="moveItem('inventory_accessories', ${index}, -1)" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-400 text-xs px-2 py-1 rounded shadow-sm">▲</button>
                            <button onclick="moveItem('inventory_accessories', ${index}, 1)" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-400 text-xs px-2 py-1 rounded shadow-sm">▼</button>
                        </div>
                        <div class="flex gap-3 items-center flex-1 pl-3">
                            <img src="${getFullImageUrl(img)}" class="w-10 h-10 object-cover rounded bg-white border">
                            <div>
                                <p class="font-black text-sm text-zinc-800 leading-tight">${data.name}</p>
                                <p class="text-[10px] font-bold text-zinc-500">${data.isLimited ? '⭐ Limited' : 'Standard'} | $${data.cost} | ${vars} Vars</p>
                            </div>
                        </div>
                        <button onclick="openAccessoryModal('${data.id}')" class="bg-zinc-200 px-3 py-1.5 rounded text-xs font-bold ml-2">Edit</button>
                    </div>`;
                });
                document.getElementById('accessories-list').innerHTML = html || '<p class="text-zinc-500 text-center bg-white p-4 rounded-xl">No Accessories added yet.</p>';
            });
        }

        // 🚀 SETTINGS UPLOADER
        async function saveBannerSettings() {
            const btn = document.getElementById('btn-save-settings');
            btn.innerText = "Saving Settings...";
            
            let finalLogoUrl = document.getElementById('setting-existing-logo').value;
            
            try {
                if (pendingUploads['setting-logo-upload']) {
                    btn.innerText = "Uploading Logo...";
                    finalLogoUrl = await uploadBlobToFirebase(pendingUploads['setting-logo-upload'], 'logos');
                    pendingUploads['setting-logo-upload'] = null;
                }

                const payload = {
                    logoUrl: finalLogoUrl,
                    isActive: document.getElementById('setting-banner-active').checked,
                    heading: document.getElementById('setting-banner-heading').value.trim(),
                    message: document.getElementById('setting-banner-message').value.trim()
                };
                
                await db.collection('store_settings').doc('banner').set(payload);
                btn.className = "w-full bg-emerald-500 text-white font-black py-3 rounded-lg transition-colors shadow-md";
                btn.innerText = "✓ Settings Saved";
                setTimeout(() => {
                    btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-lg transition-colors shadow-md";
                    btn.innerText = "Update Store Settings";
                }, 2000);
            } catch(e) {
                alert("Error saving settings: " + e.message);
                btn.innerText = "Update Store Settings";
            }
        }

        // --- CUSTOM CONFIRM & MODALS ---
        function showCustomConfirm(message, callback, title = "Confirm", isDanger = false) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            const borderBox = document.getElementById('confirm-border');
            const yesBtn = document.getElementById('confirm-yes-btn');
            
            borderBox.className = isDanger 
                ? "bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-red-600 text-center animate-fade-in-up"
                : "bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-blue-500 text-center animate-fade-in-up";
            yesBtn.className = isDanger 
                ? "flex-1 bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-3 rounded-lg"
                : "flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-3 rounded-lg";
                
            pendingConfirmCallback = callback;
            document.getElementById('custom-confirm').classList.remove('hidden');
        }
        function closeConfirm(result) {
            document.getElementById('custom-confirm').classList.add('hidden');
            const cb = pendingConfirmCallback;
            pendingConfirmCallback = null; 
            if (result && cb) cb();
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // ORDERS LOGIC
        function openOrderModal(id = null) {
            document.getElementById('o-id').value = id || '';
            const data = id ? allData.orders[id] : { name: '', eta: '', status: 'Preparing', products: [], updates: [] };
            document.getElementById('order-modal-title').innerText = id ? 'Edit Order' : 'New Order';
            document.getElementById('o-name').value = data.name;
            document.getElementById('o-eta').value = data.eta === 'TBA' ? '' : (data.eta || '');
            document.getElementById('o-status').value = data.status || 'Preparing';
            document.getElementById('o-products').value = (data.products || []).join(', ');
            
            const tlWrap = document.getElementById('o-timeline-wrapper');
            const tl = document.getElementById('o-timeline');
            if (id && data.updates) {
                tlWrap.classList.remove('hidden');
                tl.innerHTML = data.updates.map(u => `
                    <div class="flex gap-1 update-line mb-1 items-center">
                        <input type="text" class="u-date w-24 p-2 text-xs font-bold border rounded-md" value="${u.date}">
                        <input type="text" class="u-msg flex-1 p-2 text-xs border rounded-md" value="${u.msg}">
                        <button onclick="this.parentElement.remove()" class="text-red-500 font-bold px-2 text-lg">&times;</button>
                    </div>`).join('');
            } else {
                tlWrap.classList.add('hidden'); tl.innerHTML = '';
            }
            document.getElementById('btn-del-order').classList.toggle('hidden', !id);
            document.getElementById('modal-order').classList.remove('hidden');
        }

        async function saveOrder() {
            const id = document.getElementById('o-id').value;
            const payload = {
                name: document.getElementById('o-name').value,
                eta: document.getElementById('o-eta').value || "TBA",
                status: document.getElementById('o-status').value,
                products: document.getElementById('o-products').value.split(',').map(p=>p.trim()).filter(p=>p)
            };
            if(!payload.name) return alert("Needs a name!");

            if(id) {
                const uLines = document.querySelectorAll('.update-line');
                payload.updates = Array.from(uLines).map(l => ({ date: l.querySelector('.u-date').value, msg: l.querySelector('.u-msg').value })).filter(u => u.date && u.msg);
                if(payload.status === "Delivered" && payload.updates.length) payload.deliveredDate = payload.updates[payload.updates.length-1].date;
                await db.collection('orders_public').doc(id).update(payload);
            } else {
                payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                payload.updates = [{ date: new Date().toLocaleDateString(), msg: "Order placed." }];
                await db.collection('orders_public').add(payload);
            }
            closeModal('modal-order');
        }
        async function deleteOrder() { 
            showCustomConfirm("This will permanently delete this order.", async () => {
                await db.collection('orders_public').doc(document.getElementById('o-id').value).delete(); 
                closeModal('modal-order');
            }, "Delete Order", true);
        }

        // 🚀 POKEMON WITH UPLOADER
        function openPokemonModal(id = null) {
            document.getElementById('p-id').value = id || '';
            const data = id ? allData.pokemon[id] : { name: '', image: '', cost: '', stock: 0, isComingSoon: false, releaseDate: '' };
            
            document.getElementById('p-name').value = data.name;
            pendingUploads['p-image-upload'] = null; // Clear old pending crops
            
            document.getElementById('p-existing-image').value = data.image || '';
            document.getElementById('p-image-upload').value = '';
            const preview = document.getElementById('p-image-preview');
            if(data.image) { preview.src = getFullImageUrl(data.image); preview.classList.remove('hidden'); } 
            else { preview.classList.add('hidden'); }
            
            document.getElementById('p-cost').value = data.cost;
            document.getElementById('p-stock').value = data.stock;
            document.getElementById('p-coming').checked = data.isComingSoon;
            document.getElementById('p-release').value = data.releaseDate || '';
            
            document.getElementById('btn-del-pokemon').classList.toggle('hidden', !id);
            document.getElementById('modal-pokemon').classList.remove('hidden');
        }

        async function savePokemon() {
            const btn = document.getElementById('btn-save-pokemon');
            btn.innerText = "Saving Item...";
            const id = document.getElementById('p-id').value;
            
            let finalImageUrl = document.getElementById('p-existing-image').value;
            
            try {
                if (pendingUploads['p-image-upload']) {
                    btn.innerText = "Uploading Photo...";
                    finalImageUrl = await uploadBlobToFirebase(pendingUploads['p-image-upload'], 'pokemon');
                    pendingUploads['p-image-upload'] = null;
                }

                if(!document.getElementById('p-name').value || !finalImageUrl) {
                    btn.innerText = "Save Item";
                    return alert("Needs Name and Image!");
                }

                const payload = {
                    name: document.getElementById('p-name').value,
                    image: finalImageUrl,
                    cost: Number(document.getElementById('p-cost').value),
                    stock: Number(document.getElementById('p-stock').value),
                    isComingSoon: document.getElementById('p-coming').checked,
                    releaseDate: document.getElementById('p-release').value
                };

                if(id) {
                    payload.sortOrder = allData.pokemon[id].sortOrder || 99;
                    await db.collection('inventory_sealed').doc(id).set(payload);
                } else {
                    payload.sortOrder = currentSortedPokemon.length;
                    await db.collection('inventory_sealed').add(payload);
                }
                btn.innerText = "Save Item";
                closeModal('modal-pokemon');
            } catch(e) {
                alert("Error saving: " + e.message);
                btn.innerText = "Save Item";
            }
        }
        async function deletePokemon() { 
            showCustomConfirm("Permanently delete this Pokemon item?", async () => {
                await db.collection('inventory_sealed').doc(document.getElementById('p-id').value).delete(); 
                closeModal('modal-pokemon');
            }, "Delete Item", true);
        }

        // 🚀 ACCESSORIES WITH UPLOADER
        function toggleVariantsUI() {
            const hasVars = document.getElementById('a-has-variants').checked;
            document.getElementById('a-predefined-variants').classList.toggle('hidden', !hasVars);
            document.getElementById('a-main-img-container').classList.toggle('hidden', hasVars);
        }

        function toggleColorInput(i) {
            const isChecked = document.getElementById(`v-cb-${i}`).checked;
            const uploadZone = document.getElementById(`v-upload-zone-${i}`);
            if(isChecked) { uploadZone.classList.remove('hidden'); } 
            else { 
                uploadZone.classList.add('hidden'); 
                document.getElementById(`v-img-upload-${i}`).value = ''; 
                document.getElementById(`v-existing-img-${i}`).value = '';
                pendingUploads[`v-img-upload-${i}`] = null;
            }
        }

        function openAccessoryModal(id = null) {
            document.getElementById('a-id').value = id || '';
            const data = id ? allData.accessories[id] : { name: '', image: '', cost: '', isLimited: false, variants: [] };
            
            document.getElementById('a-name').value = data.name;
            
            // Main Image Reset
            pendingUploads['a-image-upload'] = null;
            document.getElementById('a-existing-image').value = data.image || '';
            document.getElementById('a-image-upload').value = '';
            const mainPreview = document.getElementById('a-image-preview');
            if(data.image) { mainPreview.src = getFullImageUrl(data.image); mainPreview.classList.remove('hidden'); } 
            else { mainPreview.classList.add('hidden'); }

            document.getElementById('a-cost').value = data.cost;
            document.getElementById('a-limited').checked = data.isLimited;
            
            // Variant Reset
            PREDEFINED_COLORS.forEach((_, i) => {
                document.getElementById(`v-cb-${i}`).checked = false;
                document.getElementById(`v-existing-img-${i}`).value = '';
                document.getElementById(`v-img-upload-${i}`).value = '';
                document.getElementById(`v-upload-zone-${i}`).classList.add('hidden');
                document.getElementById(`v-img-preview-${i}`).classList.add('hidden');
                pendingUploads[`v-img-upload-${i}`] = null;
            });

            const hasVariants = data.variants && data.variants.length > 0;
            document.getElementById('a-has-variants').checked = hasVariants;
            toggleVariantsUI();

            if(hasVariants) {
                data.variants.forEach(v => {
                    const index = PREDEFINED_COLORS.findIndex(c => c.hex.toLowerCase() === v.color.toLowerCase());
                    if(index !== -1) {
                        document.getElementById(`v-cb-${index}`).checked = true;
                        document.getElementById(`v-upload-zone-${index}`).classList.remove('hidden');
                        document.getElementById(`v-existing-img-${index}`).value = v.image;
                        const vPreview = document.getElementById(`v-img-preview-${index}`);
                        vPreview.src = getFullImageUrl(v.image);
                        vPreview.classList.remove('hidden');
                    }
                });
            }
            
            document.getElementById('btn-del-accessory').classList.toggle('hidden', !id);
            document.getElementById('modal-accessory').classList.remove('hidden');
        }

        async function saveAccessory() {
            const btn = document.getElementById('btn-save-accessory');
            btn.innerText = "Saving Accessory...";
            const id = document.getElementById('a-id').value;
            const hasVariants = document.getElementById('a-has-variants').checked;

            try {
                const payload = {
                    name: document.getElementById('a-name').value,
                    cost: Number(document.getElementById('a-cost').value),
                    isLimited: document.getElementById('a-limited').checked,
                    variants: []
                };

                if(!payload.name) {
                    btn.innerText = "Save Accessory";
                    return alert("Needs a Name!");
                }

                if (hasVariants) {
                    for (let i = 0; i < PREDEFINED_COLORS.length; i++) {
                        if (document.getElementById(`v-cb-${i}`).checked) {
                            let finalVUrl = document.getElementById(`v-existing-img-${i}`).value;
                            
                            if (pendingUploads[`v-img-upload-${i}`]) {
                                btn.innerText = `Uploading ${PREDEFINED_COLORS[i].name}...`;
                                finalVUrl = await uploadBlobToFirebase(pendingUploads[`v-img-upload-${i}`], 'accessories');
                                pendingUploads[`v-img-upload-${i}`] = null;
                            }
                            
                            if(!finalVUrl) {
                                btn.innerText = "Save Accessory";
                                return alert(`Need an image for ${PREDEFINED_COLORS[i].name}!`);
                            }
                            payload.variants.push({ color: PREDEFINED_COLORS[i].hex, image: finalVUrl });
                        }
                    }
                    if(payload.variants.length === 0) {
                        btn.innerText = "Save Accessory";
                        return alert("Please select at least one color variant.");
                    }
                    payload.image = payload.variants[0].image; 
                } else {
                    let finalMainUrl = document.getElementById('a-existing-image').value;
                    
                    if (pendingUploads['a-image-upload']) {
                        btn.innerText = "Uploading Photo...";
                        finalMainUrl = await uploadBlobToFirebase(pendingUploads['a-image-upload'], 'accessories');
                        pendingUploads['a-image-upload'] = null;
                    }
                    
                    if(!finalMainUrl) {
                        btn.innerText = "Save Accessory";
                        return alert("Needs a Main Image!");
                    }
                    payload.image = finalMainUrl;
                }

                if(id) {
                    payload.sortOrder = allData.accessories[id].sortOrder || 99;
                    await db.collection('inventory_accessories').doc(id).set(payload);
                } else {
                    payload.sortOrder = currentSortedAccessories.length;
                    await db.collection('inventory_accessories').add(payload);
                }
                btn.innerText = "Save Accessory";
                closeModal('modal-accessory');
            } catch(e) {
                alert("Error saving: " + e.message);
                btn.innerText = "Save Accessory";
            }
        }
        
        async function deleteAccessory() { 
            showCustomConfirm("Permanently delete this Accessory?", async () => {
                await db.collection('inventory_accessories').doc(document.getElementById('a-id').value).delete(); 
                closeModal('modal-accessory');
            }, "Delete Accessory", true);
        }
    </script>
</body>
</html>
